[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chronodict"
version = "0.1.0"
description = "An experimental time-aware indexed Python mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Documentation = "https://github.com/ChronoDict/ChronoDict#documentation"
Repository = "https://github.com/ChronoDict/ChronoDict"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "chronodict._native"
features = ["python"]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "SECURITY.md", format = "sdist" },
    { path = "PHASE6.md", format = "sdist" },
    { path = "project-map.md", format = "sdist" },
    { path = "docs/*.md", format = "sdist" },
    { path = "benchmarks/*.py", format = "sdist" },
    { path = "examples/*.py", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
]
